name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug in CompanyOS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us investigate and resolve it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Stack Traces
      description: Paste any error output, traceback, or browser console logs here.
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - API / FastAPI Backend (`apps/api`)
        - Web UI / Next.js (`apps/web`)
        - Worker / Temporal (`apps/worker`)
        - CLI (`packages/cli`)
        - Adapters (Telegram, Discord, Slack, etc.)
        - Other / General
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, Node.js version, Docker status, etc.
      placeholder: e.g. Linux Ubuntu 22.04, Python 3.11, Node 20.x
    validations:
      required: false
